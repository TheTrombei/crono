name: Flutter Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Usa la versión de Flutter que necesites, por ejemplo, '3.3.x' o '3.7.x'
          channel: 'stable'

      - run: flutter pub get
        working-directory: cronometro_app # Asegúrate de que este sea el directorio raíz de tu proyecto Flutter

      - run: flutter build apk --release
        working-directory: cronometro_app # Asegúrate de que este sea el directorio raíz de tu proyecto Flutter

      - uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: cronometro_app/build/app/outputs/flutter-apk/app-release.apk
